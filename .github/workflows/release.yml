# Build, test and release the MTS Event Manager extension and the MTS Capture plugin.
#
#   - pull requests: checks only
#   - push to main:  checks; if the version in package.json has no GitHub release yet
#                    (e.g. the very first release, or after a version bump), build both,
#                    create the tag v<version> and publish the release with the assets:
#                      mts-event-manager-<v>-win32-x64.vsix   (built on Windows)
#                      mts-event-manager-<v>-linux-x64.vsix   (built on Linux — sharp's native
#                                                              image binaries differ per OS)
#                      MTSCapture.dll                         (the plugin, as is)
#                    Release notes = CHANGELOG.md sections of the whole minor line (for 0.6.1:
#                    0.6.1 and 0.6.0), plus unreleased versions of an older line.
#   - manual run:    same as a push (optionally skipping the game fuzzers)
#
# Bumping a version: change "version" in package.json (the plugin reads it too) and add a
# "## [x.y.z] - date" section to CHANGELOG.md — the check fails without it.

name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".cursor/**"
      - ".claude/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_game_tests:
        description: "Skip the fuzzers that run against the Mind the School scripts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Windows: tests, the plugin, and the Windows VSIX (sharp's native Windows binaries inside).
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.existing.outputs.exists }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      - name: Changelog has this version
        run: node scripts/release-notes.js --check "${{ steps.version.outputs.version }}"

      # ── Extension ──
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run compile

      - name: Checkout game scripts (Mind the School)
        if: ${{ !inputs.skip_game_tests }}
        uses: actions/checkout@v4
        with:
          repository: SuIT-pub/Mind-the-School
          path: game-ws
          # Only the Ren'Py sources — the repository is large.
          sparse-checkout: |
            game/scripts
            game/mods
          filter: blob:none
          fetch-depth: 1

      - name: Tests
        timeout-minutes: 20
        env:
          # The fuzzers run over the game scripts; fixture checks need the full local game
          # (with images) and skip themselves here.
          MTS_WS_ROOT: ${{ inputs.skip_game_tests && 'none' || format('{0}/game-ws', github.workspace) }}
        run: npm run verify

      # ── Plugin ──
      - name: Build plugin
        run: dotnet build studio-capture/MTSCapture.csproj -c Release

      - name: Plugin tests
        run: dotnet run --project studio-capture/tests/MTSCapture.Tests.csproj -c Release

      # ── Release (main only, once per version) ──
      - name: Existing release
        id: existing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { curl -sS -o "$2" -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/$1"; }
          CODE="$(api "releases/tags/${{ steps.version.outputs.tag }}" /dev/null)"
          if [[ "$CODE" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} exists — nothing to publish."
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          # The last published release (for the notes: unreleased versions of an older minor line).
          CODE="$(api "releases/latest" latest.json)"
          PREV=""
          if [[ "$CODE" == "200" ]]; then
            PREV="$(node -p "require('./latest.json').tag_name.replace(/^v/, '')")"
          fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${PREV:-none}"

      - name: Package (Windows VSIX, plugin DLL, notes)
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          npx vsce package --skip-license --target win32-x64 --out "dist/mts-event-manager-$V-win32-x64.vsix"
          cp studio-capture/bin/Release/MTSCapture.dll dist/MTSCapture.dll
          ARGS=(--version "$V" --out dist/notes.md)
          if [[ -n "${{ steps.existing.outputs.previous }}" ]]; then ARGS+=(--previous "${{ steps.existing.outputs.previous }}"); fi
          node scripts/release-notes.js "${ARGS[@]}"
          cat >> dist/notes.md <<EOF

          ---
          **Install the extension:** *Extensions → … → Install from VSIX* — \`mts-event-manager-$V-win32-x64.vsix\` on Windows,
          \`mts-event-manager-$V-linux-x64.vsix\` on Linux.
          **Install the plugin:** copy \`MTSCapture.dll\` into \`<Honey Select 2>/BepInEx/plugins/\` (BepInEx 5 + KKAPI ≥ 1.46 required).
          EOF
          ls -la dist

      - name: Keep Windows assets
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.vsix
            dist/MTSCapture.dll
            dist/notes.md
          if-no-files-found: error

  linux:
    # The Linux VSIX: built on Linux so npm installs sharp's Linux binaries.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run compile

      - name: Unit tests (Linux)
        run: npm run verify:units

      - name: Image library loads on Linux
        run: node -e "require('sharp'); console.log('sharp', require('sharp/package.json').version, 'ok')"

      - name: Package (Linux VSIX)
        run: |
          mkdir -p dist
          npx vsce package --skip-license --target linux-x64 --out "dist/mts-event-manager-${{ needs.build.outputs.version }}-linux-x64.vsix"
          ls -la dist

      - name: Keep Linux VSIX
        if: github.event_name != 'pull_request' && needs.build.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*.vsix
          if-no-files-found: error

  release:
    needs: [build, linux]
    if: github.event_name != 'pull_request' && needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MTS Event Manager ${{ needs.build.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/mts-event-manager-${{ needs.build.outputs.version }}-win32-x64.vsix
            dist/mts-event-manager-${{ needs.build.outputs.version }}-linux-x64.vsix
            dist/MTSCapture.dll
          fail_on_unmatched_files: true
